<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#0a1728" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Battle Padel" />

  <link rel="apple-touch-icon" href="./icon-1024.png" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="preload" as="image" href="./crest.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="modulepreload" crossorigin href="./assets/vendor-4KgUwnBh.js">

</head>
<body>
  <!-- R176: the boot screen. #root was empty until React mounted, which on a
       cold start is a blank near-black page for well over a second while the
       bundle downloads and twenty GLBs begin streaming. Everything here is
       INLINE on purpose — an external stylesheet would not have arrived yet,
       which is the whole problem this solves. It removes itself in main.jsx.

       R179: it plays Cobus's intro film now. His call: every launch, no skip,
       and the first launch waits for the video rather than starting without
       it. The badge underneath is not a fallback bolted on afterwards — it is
       what paints in the first 100ms while the film is still arriving, and it
       is what you get if the film never arrives at all. -->
  <script>window.__bootAt = Date.now();</script>
  <div id="boot" aria-hidden="true">
    <img id="boot-mark" src="./crest.png" width="280" height="236" alt="" />
    <video id="boot-vid" playsinline muted preload="auto" disablepictureinpicture
           poster="./intro2-poster.jpg" aria-hidden="true" tabindex="-1"></video>
  </div>
  <style>
    /* R184: the film is 720x1280 now, and its own ground is a FLAT navy that
       measures rgb(18,33,60). The old radial gradient was built to sit behind
       a 16:9 band; behind a full-height portrait film its bright centre would
       show through the letterbox strips as a halo around a flat rectangle.
       The film's own colour is the ground now, with only a slight fall-off at
       the very edges, so the strips above and below it are invisible. */
    #boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      background: radial-gradient(130% 90% at 50% 46%, #16294a 0%, #12213c 62%, #0d1a2e 100%);
      transition: opacity .42s ease; }
    #boot > * { grid-area: 1 / 1; }
    /* R180b: 280px fixed measured 91% of the screen on a 320-wide phone with
       the glow touching both edges. The cap keeps 280 from 412 up and scales
       below it. 280 x dpr3 = 840 device px, and the crest is authored at
       exactly 840 wide for that reason — it is the resolution ceiling, so
       nothing above it would ever be sampled.
       R184: the drop-shadows were a COOL GREY halo built for a chrome
       medallion. Under a neon crest a grey halo is the one thing that reads
       as fake, so the near shadow becomes the tube's own blue and the far one
       stays black to hold the mark off the ground. */
    #boot-mark { width: min(280px, 68vw); height: auto;
      filter: drop-shadow(0 0 16px rgba(79,195,255,.42)) drop-shadow(0 10px 30px rgba(0,0,0,.65));
      animation: bootPulse 2.4s ease-in-out infinite;
      transition: opacity .3s ease; }
    /* R184: the new film is PORTRAIT — 720x1280, 9:16. The old one was
       1280x720 and had to be played as a feathered 16:9 band because cropping
       a landscape film to a phone would have kept the middle 46% of its
       width. None of that applies now: 9:16 against a 9:19.5 phone is the
       same shape, near enough, so it plays FULL BLEED.
       `contain`, not `cover`. Cover would fill the last 18% of the height by
       cropping 9% off the top and bottom of every frame — and the crest that
       opens the film sits high, so the banner would be the first thing lost.
       Contain shows the whole frame and leaves two short strips of ground,
       which are invisible because the ground is the film's own navy. The
       feather stays, at the very edge, to hide the one-pixel seam where a
       compressed flat field meets a CSS flat field. */
    #boot-vid { width: 100%; height: 100%; -o-object-fit: contain; object-fit: contain;
      opacity: 0; transition: opacity .35s ease; pointer-events: none;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 4%, #000 96%, transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 4%, #000 96%, transparent 100%); }
    #boot.playing #boot-vid { opacity: 1; }
    #boot.playing #boot-mark { opacity: 0; }
    #boot.gone { opacity: 0; pointer-events: none; }
    @keyframes bootPulse { 0%,100% { transform: scale(1); opacity: .92 }
                           50%     { transform: scale(1.045); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { #boot-mark { animation: none } }
  </style>
  <script>
    (function () {
      var boot = document.getElementById("boot");
      var vid = document.getElementById("boot-vid");
      /* window.__introDone resolves when the boot screen is allowed to leave.
         main.jsx awaits it, so the film gates the app rather than racing it. */
      var settle;
      window.__introDone = new Promise(function (r) { settle = r; });
      var done = false;
      function finish(why) {
        if (done) return; done = true;
        window.__introWhy = why;
        try { vid.pause(); } catch (e) {}
        settle();
      }

      /* Reduced motion is the one case that skips the film outright. This is
         precisely the motion that setting exists to suppress, and honouring it
         is not the same as adding the skip button we deliberately left out. */
      var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (calm) { finish("reduced-motion"); }
      else {
        vid.src = "./intro2.mp4";
        /* TWO ceilings, not one, and the difference matters. "No skip" must
           not mean "no escape" — a blocked autoplay, a codec the device
           refuses, a stalled download on a train would otherwise hold the user
           on a still frame forever. But a single cap counted from page parse
           gets spent on the DOWNLOAD: on a slow connection the film would
           start at 8s and be cut off mid-shot by a 14s cap.
           So: 8s for playback to BEGIN, and once it has, the film's own run
           time plus 3s of slack. A re-cut film needs no code change — the cap
           is read from the media, not typed in. */
        var cap = setTimeout(function () { finish("start-timeout"); }, 8000);
        vid.addEventListener("ended", function () { clearTimeout(cap); finish("ended"); });
        vid.addEventListener("error", function () { clearTimeout(cap); finish("error"); });
        vid.addEventListener("playing", function () {
          boot.classList.add("playing");
          clearTimeout(cap);
          var left = (isFinite(vid.duration) ? vid.duration - vid.currentTime : 11) * 1000 + 3000;
          cap = setTimeout(function () { finish("run-timeout"); }, left);
        });
        var p = vid.play();
        if (p && p.catch) p.catch(function () { clearTimeout(cap); finish("autoplay-blocked"); });
      }

      /* last-resort failsafe, unchanged from R176: if the module never loads at
         all, the boot screen would sit there hiding the failure. */
      setTimeout(function () { var b = document.getElementById("boot"); if (b) b.remove(); }, 25000);
    })();
  </script>
  <div id="root"></div>
</body>
</html>
